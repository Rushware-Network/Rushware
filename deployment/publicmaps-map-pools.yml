# Rushware: PublicMaps KOTF / FFA / KOTH / TDM and CommunityMaps touchdown / arcade voting.
# Capacity policy: default total ordinary capacity <=24; see map-capacity-policy.json.
# Arcade excludes MMB: Anthill, Random Items and Survive or Die: Oracle (Minecraft 1.21 required).
pools:
  publicmaps:
    type: voted
    enabled: true
    dynamic: true
    players: 0
    cycle-time: "20s" # Vote opens at 15s; reveal/preload at 5s. Native preload may cycle early.
    poll-delay: "5s"
    vote-options: 5
    variants: [default]
    modifier: "score * bound(1 - (0.2 * same_gamemode), 0.2, 1)"
    score:
      persist: true
    maps:
      - '5man'
