# Insert before PGM's default group. Keep name/team colors separate from group symbols.
  admin:
    prefix: "&b&l❑&r "
    suffix: ""
    display-name: "&bAdmin"
    observer-permissions:
      - "+pgm.start"
      - "+pgm.cycle"
      - "+pgm.stop"
      - "+pgm.setnext"
      - "+pgm.resize"
      - "+pgm.join.force"
      - "+pgm.join.choose"
      - "+pgm.vanish"
      - "+pgm.defuse"
    participant-permissions:
      - "-pgm.start"
      - "+pgm.cycle"
      - "+pgm.stop"
      - "-pgm.setnext"
      - "-pgm.resize"
      - "-pgm.join.force"
      - "-pgm.join.choose"
      - "-pgm.vanish"
      - "-pgm.defuse"
  sponsor:
    prefix: "&5&l✳&r "
    suffix: ""
    display-name: "&5Sponsor"
  supporter:
    prefix: "&d&l✳&r "
    suffix: ""
    display-name: "&dSupporter"
