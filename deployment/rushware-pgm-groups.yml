      - "-pgm.start"
      - "-pgm.stop"
      - "-pgm.setnext"
      - "-pgm.resize"
      - "-pgm.join.force"
      - "-pgm.join.choose"
      - "-pgm.vanish"
      - "-pgm.defuse"
  sponsor: {}
  supporter: {}
